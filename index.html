<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McDo PayBuddy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--p:#6C3FC5;--d:#452080;--soft:#E9DFFF;--bg:#F6F1FF;--card:#fff;--ink:#29213D;--mut:#6D6585;--ok:#DDF5E5;--bad:#B3261E;--sh:0 6px 20px rgba(69,32,128,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#8A5FE0;--soft:#3A2B63;--bg:#1B1230;--card:#2A1F45;--ink:#F1EBFF;--mut:#B9ACD8;--ok:#1F4A33;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme=dark]{--p:#8A5FE0;--soft:#3A2B63;--bg:#1B1230;--card:#2A1F45;--ink:#F1EBFF;--mut:#B9ACD8;--ok:#1F4A33;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
#app{max-width:520px;margin:auto;padding:20px 16px 130px}
h1{font-size:1.7rem;font-weight:900;margin-bottom:2px}h2{font-size:1.1rem;font-weight:800;margin-bottom:8px}
.mut,small,.sm{color:var(--mut)}.sm{font-size:.85rem}.bad{color:var(--bad);font-weight:700}
.note{font-size:.8rem;color:var(--mut);margin:16px 4px;text-align:center}
.warn{background:#FFF3CD;color:#5c4400;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0;display:flex;flex-direction:column}.grid b{font-size:1.5rem;font-weight:900}.wide{grid-column:1/3}
.hero{background:linear-gradient(145deg,var(--p),var(--d));color:#fff;border-radius:28px;padding:22px;margin:14px 0;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero strong{font-size:clamp(2.6rem,13vw,3.6rem);font-weight:900;line-height:1.05}.hero .sm,.hero .lk{color:#E9DFFF}
.bar{height:12px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.btn{background:var(--p);color:#fff;border-radius:18px;min-height:52px;padding:0 20px;font-weight:800;width:100%;box-shadow:var(--sh)}
.btn.big{min-height:62px;font-size:1.2rem;border-radius:22px;margin:4px 0 12px}.btn:disabled{opacity:.6}
.ghost{display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:16px;min-height:48px;padding:0 16px;font-weight:700;width:100%;margin-top:8px;text-align:center}
.danger{color:var(--bad)}.lk{text-decoration:underline;font-size:.85rem;text-align:left;color:var(--p)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.mnav button{width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:1.3rem;font-weight:800}.mnav b{font-weight:800}
.pills{display:flex;gap:8px;margin-bottom:6px}.pills button,.chips button{flex:1;background:var(--soft);border-radius:14px;min-height:44px;font-weight:700;padding:0 10px}.pills .on,.chips .on{background:var(--p);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{flex:none;min-height:40px;font-size:.85rem}
.r{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--soft)}.r:last-child{border:0}.r.tot{background:var(--ok);border-radius:14px;padding:12px;margin-top:8px;font-size:1.15rem;border:0}
.shift{display:flex;justify-content:space-between;align-items:center;background:var(--ok);gap:8px}.shift .er{text-align:right}.shift small{display:block}
.x{width:40px;height:40px;border-radius:50%;font-size:1rem}h3{margin:16px 4px 0;font-size:.95rem;color:var(--mut)}
.empty{text-align:center;padding:26px 16px}
label{display:block;font-weight:700;margin-bottom:12px;font-size:.9rem}
input,select{display:block;width:100%;margin-top:4px;min-height:48px;border-radius:14px;border:2px solid var(--soft);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}input:focus{border-color:var(--p);outline:0}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(69,32,128,.15);z-index:10}
nav[hidden]{display:none}nav button{display:flex;flex-direction:column;align-items:center;font-size:1.3rem;min-width:60px;min-height:48px;color:var(--mut)}nav span{font-size:.7rem;font-weight:700}nav .on{color:var(--p)}
nav .plus{background:var(--p);color:#fff;width:56px;height:56px;min-width:0;border-radius:50%;font-size:2rem;margin-top:-26px;box-shadow:var(--sh)}
#sheet{position:fixed;inset:0;z-index:30;display:none}#sheet.open{display:block}.bd{position:absolute;inset:0;background:rgba(41,33,61,.55)}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pv{background:var(--soft);border-radius:16px;padding:12px;margin:8px 0 12px;min-height:60px}.pv strong{font-size:1.4rem}
.ov{position:fixed;inset:0;z-index:50;background:rgba(41,33,61,.6);display:grid;place-items:center;padding:20px}.bx{background:var(--card);border-radius:22px;padding:20px;max-width:340px;width:100%}.bx p{margin-bottom:16px;font-weight:700}
#toast{position:fixed;left:16px;right:16px;bottom:100px;max-width:480px;margin:auto;background:var(--d);color:#fff;border-radius:16px;padding:14px 16px;font-weight:700;z-index:40;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:none;pointer-events:auto}#toast .ub{background:#fff;color:var(--d);border-radius:10px;padding:4px 14px;margin-left:8px;font-weight:800}
.setup{padding-top:30px}.logo{font-size:3rem}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--p),var(--d))}
.card{border:1px solid color-mix(in srgb,var(--p) 10%,transparent);box-shadow:0 1px 2px rgba(69,32,128,.06),0 8px 24px rgba(69,32,128,.07);border-radius:24px}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(175,140,255,.55),transparent 60%),linear-gradient(150deg,var(--p),var(--d));border-radius:32px}
.hero strong{font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero>span:first-child{align-self:flex-start;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 12px;font-size:.8rem;font-weight:700;margin-bottom:6px}
.grid b{font-weight:800;letter-spacing:-.02em}h1{font-weight:800;letter-spacing:-.02em}
.chips button{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--card);border:1px solid var(--soft)}.chips .i{width:16px;height:16px;color:var(--p)}
.pills{background:var(--soft);padding:4px;border-radius:18px}.pills button{background:none;border-radius:14px}.pills .on{background:var(--card);color:var(--p);box-shadow:0 2px 8px rgba(69,32,128,.15)}
.mnav button{display:grid;place-items:center;background:var(--card);border:1px solid var(--soft)}.mnav .i{width:20px;height:20px}
.x{display:grid;place-items:center;background:var(--soft)}.x .i{width:18px;height:18px}
.shift{border-left:5px solid #4CAF7A}.empty .i{width:40px;height:40px;color:var(--p);margin-bottom:6px}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,var(--p),var(--d));color:#fff;display:grid;place-items:center;margin-bottom:14px}.logo .i{width:34px;height:34px}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;border-radius:30px;padding:8px 10px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--soft)}
nav button{border-radius:20px;padding:6px 10px;gap:2px}nav .on{background:var(--soft)}
nav .plus{width:54px;height:54px;min-width:0;padding:0;margin-top:0;display:grid;place-items:center;background:linear-gradient(145deg,var(--p),var(--d));color:#fff}nav .plus .i{width:28px;height:28px}
.pn::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--soft);margin:-8px auto 14px}
#toast{bottom:104px}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.noprint,#toast{display:none!important}#app{padding:0}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol><symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol><symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol><symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol><symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7a2 2 0 012-2h12v4"/><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="16.5" cy="14" r="1.2"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol></svg>
<div id="app"></div>
<nav hidden>
<button data-t="home" onclick="go('home')"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button>
<button data-t="cut" onclick="go('cut')"><svg class="i" aria-hidden="true"><use href="#i-receipt"/></svg><span>Cutoff</span></button>
<button class="plus" onclick="openSheet()" aria-label="Log my shift"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
<button data-t="hist" onclick="go('hist')"><svg class="i" aria-hidden="true"><use href="#i-cal"/></svg><span>History</span></button>
<button data-t="set" onclick="go('set')"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg><span>Settings</span></button>
</nav>
<div id="sheet"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const K='mcdo-paybuddy-v1',D=()=>({rate:0,pay1:15,pay2:0,goal:0,shifts:[],adj:{}});
let S=D(),noStore=false;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){noStore=true}
try{const j=JSON.parse(localStorage.getItem(K));if(j&&Array.isArray(j.shifts))S={...D(),...j}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){noStore=true}};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>ds(new Date());
const dim=(y,m)=>new Date(y,m+1,0).getDate(),fd=(d,o)=>d.toLocaleDateString('en-PH',o||{month:'short',day:'numeric'});
const t12=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+pad(m)+' '+(h<12?'AM':'PM')};
const span=s=>{const a=new Date(s.date+'T'+s.in),b=new Date(s.date+'T'+s.out);if(b<=a)b.setDate(b.getDate()+1);return[a,b]};
const hrs=s=>{const[a,b]=span(s);return(b-a)/36e5},earn=s=>hrs(s)*S.rate;
const dur=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h '+(m%60)+'m'};
const cutOf=d=>({y:+d.slice(0,4),m:+d.slice(5,7)-1,c:+d.slice(8,10)<=15?1:2});
const inCut=(s,y,m,c)=>{const o=cutOf(s.date);return o.y==y&&o.m==m&&o.c==c};
function cd(y,m,c){const sh=S.shifts.filter(s=>inCut(s,y,m,c)),h=sh.reduce((a,s)=>a+hrs(s),0),key=`${y}-${pad(m+1)}-${c}`,ad=S.adj[key]||[];
const add=ad.filter(a=>!a.ded).reduce((a,x)=>a+x.amt,0),ded=ad.filter(a=>a.ded).reduce((a,x)=>a+x.amt,0),reg=h*S.rate;
return{sh,h,key,ad,add,ded,reg,gross:reg+add,net:reg+add-ded}}
const pd=(y,m,c)=>{const n=dim(y,m);return new Date(y,m,c==1?Math.min(S.pay1||15,n):(S.pay2?Math.min(S.pay2,n):n))};
function nextPay(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
for(let i=0;i<3;i++)for(const c of[1,2]){const d=pd(t.getFullYear(),t.getMonth()+i,c);if(d>=t)return{d,days:Math.round((d-t)/864e5)}}}
let V=cutOf(today()),tab='home',F='cut',saving=false,editId=null;
const NOTE='Amounts are estimates only. Actual payroll may include employer-specific rules, statutory deductions, adjustments and different rates for eligible hours. Not affiliated with McDonald’s.';
const PRIV='Your records stay in this browser only — no account, no syncing between devices. Clearing browser data can erase them, so download a backup now and then.';
function toast(t,u){const e=$('#toast');toast.u=u;e.innerHTML=esc(t)+(u?' <button class="ub" onclick="toast.u();$(\'#toast\').classList.remove(\'show\')">Undo</button>':'');e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),u?6000:3800)}
function ask(msg,ok='Delete'){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="bx" role="alertdialog"><p>${esc(msg)}</p><div class="row"><button class="ghost" style="margin:0">Cancel</button><button class="btn">${ok}</button></div></div>`;
const[a,b]=d.querySelectorAll('button');a.onclick=()=>{d.remove();r(false)};b.onclick=()=>{d.remove();r(true)};document.body.append(d);b.focus()})}
const mv=n=>{const d=new Date(V.y,V.m+n,1);V.y=d.getFullYear();V.m=d.getMonth();render()},setC=c=>{V.c=c;render()};
const go=t=>{tab=t;render();scrollTo(0,0)};
const mnav=()=>`<div class="mnav noprint"><button onclick="mv(-1)" aria-label="Previous month">${ic('left')}</button><b>${new Date(V.y,V.m,1).toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button onclick="mv(1)" aria-label="Next month">${ic('right')}</button></div>`;
const pills=()=>`<div class="pills"><button class="${V.c==1?'on':''}" onclick="setC(1)">1st–15th</button><button class="${V.c==2?'on':''}" onclick="setC(2)">16th–End of Month</button></div>`;

function pHome(){const{y,m,c}=V,d=cd(y,m,c),o=cd(y,m,3-c),nx=nextPay(),pct=S.goal>0?Math.min(100,d.gross/S.goal*100):0;
return `<h1>Hi, Crew! 👋</h1><p class="mut">Here’s how much you’ve earned so far.</p>${mnav()}${pills()}
<section class="hero"><span>Current cutoff earnings (estimate)</span><strong>${peso(d.gross)}</strong>
<span>${d.h.toFixed(2)} paid hours logged · ${d.sh.length} shift${d.sh.length==1?'':'s'}</span>
${S.goal>0?`<div class="bar"><i style="width:${pct}%"></i></div><span class="sm">${Math.round(pct)}% of your ${peso(S.goal)} goal</span>`:`<button class="lk" onclick="go('set')">Set an earnings goal</button>`}
<span class="sm">Payday: ${fd(pd(y,m,c),{month:'long',day:'numeric'})} (set in Settings)</span></section>
<button class="btn big" onclick="openSheet()">+ Log My Shift</button>
<p class="sm">Or tap a shift to log it for today in one tap:</p><div class="chips" style="margin-top:6px">${recent().map(([a,b])=>`<button onclick="quick('${a}','${b}')">${ic('zap')}${t12(a)}–${t12(b)}</button>`).join('')}</div>
<div class="grid"><div class="card"><small>Next payday</small><b>${nx?fd(nx.d):'–'}</b><small>${nx?(nx.days==0?'Today! 🎉':nx.days==1?'Tomorrow':'in '+nx.days+' days'):''}</small></div>
<div class="card"><small>Hours worked</small><b>${d.h.toFixed(2)}</b><small>this cutoff</small></div>
<div class="card wide"><small>Estimated monthly earnings</small><b>${peso(d.gross+o.gross)}</b><small>both cutoffs combined</small></div></div>
${d.sh.length?'':`<div class="card empty">${ic('clock')}<p><b>No shifts logged for this cutoff</b><br>Tap “+ Log My Shift” after your next shift and your pay shows up here.</p></div>`}
<p class="note">${NOTE}</p>`}

function pCut(){const{y,m,c}=V,d=cd(y,m,c),end=dim(y,m),r=(a,b,k='')=>`<div class="r ${k}"><span>${a}</span><b>${b}</b></div>`;
return `<h1>Cutoff</h1>${mnav()}${pills()}<div class="card"><h2>${fd(new Date(y,m,c==1?1:16))} – ${fd(new Date(y,m,c==1?15:end))}</h2>
${r('Shifts',d.sh.length)}${r('Total paid hours',d.h.toFixed(2))}${r('Regular earnings',peso(d.reg))}${r('Additional pay','+'+peso(d.add))}${r('Estimated gross pay',peso(d.gross))}${r('Deductions','−'+peso(d.ded))}${r('Estimated take-home pay',peso(d.net),'tot')}</div>
<div class="card"><h2>Pay adjustments (optional)</h2><p class="sm" style="margin-bottom:8px">Add only what you actually received or paid. Nothing is applied automatically.</p>
${d.ad.map(a=>`<div class="r"><span>${esc(a.label)}</span><b>${a.ded?'−':'+'}${peso(a.amt)} <button class="x" onclick="delAdj('${a.id}')" aria-label="Remove ${esc(a.label)}">${ic('x')}</button></b></div>`).join('')}
<div class="row" style="margin-top:10px"><select id="at" aria-label="Type"><option value="a">Overtime pay</option><option value="a">Night differential</option><option value="a">Holiday pay</option><option value="a">Other additional earnings</option><option value="d">Payroll deduction</option></select>
<input id="aa" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount ₱" aria-label="Amount"></div><button class="ghost" onclick="addAdj()">Add</button></div>
<p class="note">${NOTE}</p>`}
function addAdj(){const a=parseFloat($('#aa').value);if(!(a>0))return toast('Enter an amount above ₱0.');const k=cd(V.y,V.m,V.c).key,o=$('#at').selectedOptions[0];
(S.adj[k]=S.adj[k]||[]).push({id:uid(),label:o.text,amt:a,ded:o.value=='d'});save();render();toast('Added.')}
async function delAdj(id){if(!await ask('Remove this adjustment?','Remove'))return;const k=cd(V.y,V.m,V.c).key;S.adj[k]=(S.adj[k]||[]).filter(a=>a.id!=id);save();render()}

const byNew=(a,b)=>(b.date+b.in).localeCompare(a.date+a.in);
function pHist(){const t=cutOf(today()),n=new Date(),w0=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)),w=[ds(w0),ds(new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+6))];
const p=t.c==2?{y:t.y,m:t.m,c:1}:(x=>({y:x.getFullYear(),m:x.getMonth(),c:2}))(new Date(t.y,t.m-1,1));
const f={week:s=>s.date>=w[0]&&s.date<=w[1],cut:s=>inCut(s,t.y,t.m,t.c),prev:s=>inCut(s,p.y,p.m,p.c),month:s=>{const o=cutOf(s.date);return o.y==V.y&&o.m==V.m}}[F];
const L=S.shifts.filter(f).sort(byNew),H=L.reduce((a,s)=>a+hrs(s),0);let last='',out='';
for(const s of L){if(s.date!=last){last=s.date;out+=`<h3>${fd(new Date(s.date+'T00:00'),{weekday:'short',month:'short',day:'numeric'})}</h3>`}
const[a,b]=span(s);out+=`<div class="card shift"><div><b>${t12(s.in)} – ${t12(s.out)}${b.getDate()!=a.getDate()?' (+1 day)':''}</b><small>${dur(hrs(s))} paid${s.notes?' · '+esc(s.notes):''}</small></div>
<div class="er"><b>${peso(earn(s))}</b><span class="noprint"><button class="x" onclick="openSheet('${s.id}')" aria-label="Edit shift">${ic('pen')}</button><button class="x" onclick="del('${s.id}')" aria-label="Delete shift">${ic('trash')}</button></span></div></div>`}
const ch=(k,l)=>`<button class="${F==k?'on':''}" onclick="F='${k}';render()">${l}</button>`;
return `<h1>Shift history</h1><div class="chips noprint" style="margin-top:12px">${ch('week','This week')}${ch('cut','Current cutoff')}${ch('prev','Previous cutoff')}${ch('month','Select month')}</div>
${F=='month'?mnav():''}<p class="mut">${L.length} shift${L.length==1?'':'s'} · ${H.toFixed(2)} hrs · <b>${peso(H*S.rate)}</b> estimated</p>
${out||`<div class="card empty">${ic('clock')}<p><b>No shifts here yet</b><br>Shifts you log for this period will be listed here.</p></div>`}
<div class="row noprint" style="margin-top:12px"><button class="ghost" onclick="csv()">Export CSV</button><button class="ghost" onclick="prt()">Print month</button></div><p class="note noprint">Export and print use the month shown in “Select month”.</p>`}
async function del(id){if(await ask('Delete this shift? This can’t be undone.')){S.shifts=S.shifts.filter(s=>s.id!=id);save();render();toast('Shift deleted.')}}
function csv(){const q=x=>{x=String(x);if(/^[=+\-@]/.test(x))x="'"+x;return'"'+x.replace(/"/g,'""')+'"'},rows=[['Date','Time In','Time Out','Paid Hours','Estimated Earnings (PHP)','Notes']];
S.shifts.filter(s=>{const o=cutOf(s.date);return o.y==V.y&&o.m==V.m}).sort((a,b)=>-byNew(a,b)).forEach(s=>rows.push([s.date,s.in,s.out,hrs(s).toFixed(2),earn(s).toFixed(2),s.notes||'']));
rows.push([]);[1,2].forEach(c=>{const d=cd(V.y,V.m,c);rows.push([c==1?'Cutoff 1st-15th':'Cutoff 16th-end','','',d.h.toFixed(2),'Gross '+d.gross.toFixed(2),'Take-home '+d.net.toFixed(2)])});
dl(`paybuddy-${V.y}-${pad(V.m+1)}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'))}
function prt(){F='month';render();try{window.print()}catch(e){toast('Printing isn’t available here.')}}
async function dl(name,data){try{const d=window.claude&&await window.claude.use('downloads');if(!d)return toast('Saving files isn’t available in this view.');await d.save({filename:name,data})}catch(e){if(!e||e.code!='declined')toast('Couldn’t save the file.')}}

function pSet(){return `<h1>Settings</h1><div class="card" style="margin-top:14px">
<label>Hourly rate (₱)<input id="sr" type="number" inputmode="decimal" min="1" step="any" value="${S.rate}" onchange="setS()"></label>
<label>First payday (day of month)<input id="s1" type="number" min="1" max="31" value="${S.pay1}" onchange="setS()"></label>
<label>Second payday (blank = last day of month)<input id="s2" type="number" min="1" max="31" value="${S.pay2||''}" placeholder="Last day" onchange="setS()"></label>
<label>Cutoff earnings goal, optional (₱)<input id="sg" type="number" inputmode="decimal" min="0" step="any" value="${S.goal||''}" onchange="setS()"></label></div>
<div class="card"><h2>Backup</h2><p class="sm">${PRIV}</p><button class="ghost" onclick="backup()">Download backup</button>
<label class="ghost" style="margin-bottom:0">Restore backup<input type="file" accept=".json,application/json" hidden onchange="restore(event)"></label>
<button class="ghost danger" onclick="wipe()">Erase all records</button></div><p class="note">${NOTE}</p>`}
function setS(){const r=parseFloat($('#sr').value);if(!(r>0))return toast('Enter an hourly rate above ₱0.');
S.rate=r;S.pay1=Math.min(31,Math.max(1,parseInt($('#s1').value)||15));S.pay2=Math.min(31,Math.max(0,parseInt($('#s2').value)||0));S.goal=Math.max(0,parseFloat($('#sg').value)||0);save();toast('Saved. Everything has been recalculated.')}
const backup=()=>dl(`paybuddy-backup-${today()}.json`,JSON.stringify(S,null,1));
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.shifts))throw 0;
o.shifts=o.shifts.filter(s=>s&&s.id&&/^\d{4}-\d\d-\d\d$/.test(s.date)&&/^\d\d:\d\d$/.test(s.in)&&/^\d\d:\d\d$/.test(s.out));
if(await ask('Replace all current records with this backup?','Restore')){S={...D(),...o};if(!(S.rate>0))S.rate=0;save();V=cutOf(today());render();toast('Backup restored.')}}catch(x){toast('That file isn’t a valid PayBuddy backup.')}};r.readAsText(f);e.target.value=''}
async function wipe(){if(await ask('Erase ALL shifts and settings from this browser?','Erase everything')){S=D();save();tab='home';render()}}

const pSetup=()=>`<div class="setup"><div class="logo">${ic('wallet')}</div><h1>Welcome to PayBuddy</h1><p class="mut">Log your shifts and see your estimated pay for each cutoff. Two quick things first:</p>
<div class="card"><label>Your hourly rate (₱)<input id="sr" type="number" inputmode="decimal" min="1" step="any" placeholder="Enter your own rate"></label>
<label>First payday (day of month)<input id="s1" type="number" min="1" max="31" value="15"></label>
<label style="margin:0">Second payday (blank = last day of month)<input id="s2" type="number" min="1" max="31" placeholder="Last day"></label></div>
<button class="btn big" onclick="finish()">Start tracking</button><p class="note">${PRIV}<br>${NOTE}</p></div>`;
function finish(){const r=parseFloat($('#sr').value);if(!(r>0))return toast('Enter your hourly rate to continue.');
S.rate=r;S.pay1=Math.min(31,Math.max(1,parseInt($('#s1').value)||15));S.pay2=Math.min(31,Math.max(0,parseInt($('#s2').value)||0));save();render()}

const PRE=[['06:00','14:00'],['14:00','22:00'],['22:00','06:00']];
function recent(){const seen=new Set(),o=[];for(const s of [...S.shifts].sort(byNew)){const k=s.in+s.out;if(!seen.has(k)){seen.add(k);o.push([s.in,s.out])}if(o.length==3)break}for(const p of PRE)if(o.length<4&&!o.some(x=>x[0]==p[0]&&x[1]==p[1]))o.push(p);return o}
function quick(a,b){if(quick.t>Date.now()-1500)return;quick.t=Date.now();const s={date:today(),in:a,out:b,notes:''};
if(clash(s,null)){openSheet();qs(a,b);return toast('That overlaps a saved shift. Check the times, then save.')}
const id=uid();S.shifts.push({id,...s});save();V=cutOf(s.date);render();toast(`Shift saved! Your estimated earnings increased by ${peso(earn(s))}.`,()=>{S.shifts=S.shifts.filter(x=>x.id!=id);save();render()})}
function setD(n){const d=new Date();d.setDate(d.getDate()+n);$('#fd').value=ds(d);pv()}
function addH(h){const i=$('#fi').value;if(!i)return toast('Pick your time in first.');const[a,b]=i.split(':').map(Number),t=(a*60+b+h*60)%1440;$('#fo').value=pad(Math.floor(t/60))+':'+pad(t%60);pv()}
function openSheet(id){editId=id||null;const s=id?S.shifts.find(x=>x.id==id):null,l=[...S.shifts].sort(byNew)[0],v=k=>s?esc(s[k]||''):'';
const q=recent();
$('#sheet').innerHTML=`<div class="bd" onclick="closeSheet()"></div><div class="pn" role="dialog" aria-label="Log shift"><h2>${s?'Edit shift':'Log my shift'}</h2>
${s?'':`<p class="sm">Tap a shift to fill the times:</p><div class="chips">${q.map(([a,b])=>`<button onclick="qs('${a}','${b}')">${t12(a)}–${t12(b)}</button>`).join('')}</div>`}
<div class="chips" style="margin-top:0"><button onclick="setD(0)">Today</button><button onclick="setD(-1)">Yesterday</button></div>
<label>Work date<input type="date" id="fd" value="${s?s.date:today()}" oninput="pv()"></label>
<div class="row"><label>Time in<input type="time" id="fi" value="${v('in')}" oninput="pv()"></label><label>Time out<input type="time" id="fo" value="${v('out')}" oninput="pv()"></label></div>
<div class="chips" style="margin-top:-4px"><span class="sm" style="align-self:center">Shift length:</span><button onclick="addH(6)">6h</button><button onclick="addH(8)">8h</button><button onclick="addH(9)">9h</button><button onclick="addH(10)">10h</button></div>
<label>Notes (optional)<input id="fn" maxlength="80" value="${v('notes')}"></label><div class="pv" id="pv"></div>
<button class="btn" id="sv" onclick="saveShift()">Save shift</button><button class="ghost" onclick="closeSheet()">Cancel</button></div>`;
$('#sheet').classList.add('open');pv();if(!s)$('#fi').focus()}
const closeSheet=()=>{$('#sheet').classList.remove('open');$('#sheet').innerHTML=''};
function qs(a,b){$('#fi').value=a;$('#fo').value=b;pv()}
const clash=(s,id)=>{const[a,b]=span(s);return S.shifts.some(x=>{if(x.id==id)return false;const[c,d]=span(x);return a<d&&b>c})};
function pv(){const s={date:$('#fd').value,in:$('#fi').value,out:$('#fo').value,notes:$('#fn').value.trim()},e=$('#pv');
if(!s.date||!s.in||!s.out){e.textContent='Pick your time in and time out to see your pay.';return null}
if(s.in==s.out){e.innerHTML='<span class="bad">Time in and time out can’t be the same.</span>';return null}
const h=hrs(s);e.innerHTML=`<b>${dur(h)}</b> · ${h.toFixed(2)} paid hours (breaks are paid)<br><strong>${peso(h*S.rate)}</strong> estimated${clash(s,editId)?'<br><span class="bad">This overlaps a shift you already saved.</span>':''}`;return s}
async function saveShift(){if(saving)return;const s=pv();if(!s)return;saving=true;$('#sv').disabled=true;
if(clash(s,editId)&&!await ask('This overlaps a shift you already saved. Save it anyway?','Save anyway')){saving=false;$('#sv').disabled=false;return}
let old=0;const ed=editId;if(ed){const x=S.shifts.find(z=>z.id==ed);old=earn(x);Object.assign(x,s)}else S.shifts.push({id:uid(),...s});
save();const n=earn(s),df=n-old;closeSheet();V=cutOf(s.date);render();
toast(ed?`Shift updated. Your estimate ${df<0?'decreased':'increased'} by ${peso(Math.abs(df))}.`:`Shift saved! Your estimated earnings increased by ${peso(n)}.`);saving=false}

function render(){const app=$('#app'),nav=$('nav');
if(!(S.rate>0)){app.innerHTML=pSetup();nav.hidden=true;return}
nav.hidden=false;app.innerHTML=(noStore?'<p class="warn">Saving is blocked in this browser mode, so records will be lost when you close the page. Try a regular browser window.</p>':'')+{home:pHome,cut:pCut,hist:pHist,set:pSet}[tab]();
nav.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
render();
</script></body></html>
